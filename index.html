<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Tic Tac Toe</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main class="game-container">

        <!-- Header -->

        <div class="header">

            <p class="tag">MINI GAME</p>

            <h1>
                Tic <span>•</span> Tac <span>•</span> Toe
            </h1>

            <p class="subtitle">
                Think smart. Make your move. Win the game.
            </p>

        </div>


        <!-- Game Mode -->

        <div class="mode-container">

            <button
                id="playerMode"
                class="mode-btn active">
                👥 Player vs Player
            </button>

            <button
                id="aiMode"
                class="mode-btn">
                🤖 Play vs AI
            </button>

        </div>


        <!-- Scoreboard -->

        <div class="scoreboard">

            <div class="score-card">

                <span class="player-symbol x-symbol">
                    X
                </span>

                <p>Player X</p>

                <strong id="scoreX">0</strong>

            </div>


            <div class="status">

                <span id="statusText">
                    Player X's Turn
                </span>

            </div>


            <div class="score-card">

                <span class="player-symbol o-symbol">
                    O
                </span>

                <p id="oLabel">
                    Player O
                </p>

                <strong id="scoreO">0</strong>

            </div>

        </div>


        <!-- Game Board -->

        <div class="board" id="board">

            <button class="cell" data-index="0"></button>
            <button class="cell" data-index="1"></button>
            <button class="cell" data-index="2"></button>

            <button class="cell" data-index="3"></button>
            <button class="cell" data-index="4"></button>
            <button class="cell" data-index="5"></button>

            <button class="cell" data-index="6"></button>
            <button class="cell" data-index="7"></button>
            <button class="cell" data-index="8"></button>

        </div>


        <!-- Result -->

        <div
            id="result"
            class="result hidden">

            <div id="resultIcon">
                🏆
            </div>

            <h2 id="resultTitle">
                Player X Wins!
            </h2>

            <p id="resultMessage">
                Great game!
            </p>

        </div>


        <!-- Reset -->

        <button
            id="restartBtn"
            class="restart-btn">

            ↻ New Game

        </button>


        <p class="footer">
            Built with HTML • CSS • JavaScript
        </p>

    </main>


    <script src="script.js"></script>

</body>

</html>
